 else if(a=='chat'){S.chat=v;S.unread[v]=0}
 else if(a=='cx')S.chat=null;
 else if(a=='msend'){const x=$('#mi').value.trim();if(!x)return;const nm=S.chat,f=S.fr.find(y=>y.n==nm);(S.chats[nm]=S.chats[nm]||[]).push({me:1,t:'text',x});if(f.on)setTimeout(()=>{S.chats[nm].push({me:0,t:'text',x:'Got it, thanks.'});if(S.chat==nm)render()},1600)}
 else if(a=='invsheet'){S.iv=freshIv();S.sheet={k:'iv'}}
 else if(a=='ivsend'){const f=S.iv;if(!f.when){f.er='Choose a date and time.';render();return}
  const nm=S.chat,fr=S.fr.find(x=>x.n==nm),when=new Date(f.when).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const m={me:1,t:'invite',vid:+f.vid,when,note:f.note,st:'pending'};(S.chats[nm]=S.chats[nm]||[]).push(m);S.sheet=null;toast(fr.on?'Invite sent.':'Invite sent as a notification.');
  if(fr.on)setTimeout(()=>{m.st='accepted';S.chats[nm].push({me:0,t:'text',x:'Accepted. I’ll be there.'});if(S.chat==nm)render()},2200)}
 else if(a=='remind'){const nm=S.chat,fr=S.fr.find(x=>x.n==nm),m=S.chats[nm][+v];S.chats[nm].push({me:1,t:'remind',vid:m.vid});toast(fr.on?'Reminder sent.':'Reminder sent as a notification.')}
 else if(a=='nta'||a=='ntd'){const n=S.nt.find(x=>x.id==+v);if(a=='ntd')n.st='declined';else if(n.t=='req'){n.st='done';S.fr.push({n:n.from,on:1,role:'Clinical instructor'})}else{n.st='accepted';(S.chats[n.from]=S.chats[n.from]||[]).push({me:1,t:'text',x:'Accepted. See you then.'})}}
 else if(a=='dtab')S.tabD=v;
 else if(a=='plike'||a=='vlike'){const k=(a=='plike'?'p':'v')+v;S.lk.has(k)?S.lk.delete(k):S.lk.add(k)}
 else if(a=='pcom')S.sheet={k:'c',t:'p',id:+v};
 else if(a=='vcom')S.sheet={k:'c',t:'v',id:+v};
 else if(a=='pro')S.sheet={k:'pro',by:v};
 else if(a=='prep')S.sheet={k:'r',id:+v};
 else if(a=='rsend'){S.sheet=null;toast('Thanks. A moderator will review this post.')}
 else if(a=='xs')S.sheet=null;
 else if(a=='newpost'){S.pf=freshPf();S.sheet={k:'n'}}
 else if(a=='pk'){if(S.pf.k!=v){S.pf.url='';S.pf.name=''}S.pf.k=v}
 else if(a=='tryit'){S.open=+v;S.tabD='practice';S.pr=null}
 else if(a=='csend'){const x=$('#ci').value.trim();if(!x)return;const s=S.sheet,L=s.t=='p'?S.posts.find(y=>y.id==s.id).cm:(S.vc[s.id]=S.vc[s.id]||[]);L.push({n:S.user.name,t:x,ago:'now'})}
 else if(a=='psend'){const f=S.pf;
  if(!f.url&&!f.name){f.er='Choose or record a video or photo first.';render();return}
  if(!f.cap.trim()){f.er='Add a caption.';render();return}
  if(!f.a){f.er='Confirm no patient can be identified and that you can share this.';render();return}
  S.posts.unshift({id:nid++,k:f.k=='photo'?'photo':'video',by:S.user.name,role:S.user.role,org:'',reg:'',bio:'',verified:false,g:f.g,cap:f.cap.trim(),hue:200,ago:'Just now',views:0,likes:0,cm:[],url:f.url,img:f.isImg});S.sheet=null;toast('Posted to Reels.')}
 else if(a.startsWith('pr-'))prAct(a,+v);
 else if(a=='out'){S.scr='auth';S.au='in';S.tab='home'}
 keep=['psh','shto','fadd','invlink','chat','cx','msend','invsheet','ivsend','remind','nta','ntd','note','plike','vlike','pcom','vcom','pro','prep','rsend','xs','newpost','pk','csend','psend','step','save','pr-o','pr-q','pr-m','pr-chk','pr-reset','pr-rev','dec'].includes(a);render();if(!keep)scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;const id=e.target.id,b=id=='mi'?'msend':id=='ci'?'csend':'';if(b){e.preventDefault();document.querySelector('[data-a='+b+']').click()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='q'){S.q=t.value;$('#res').innerHTML=cards();return}
 if(t.dataset.s!=null){S.fd.s[+t.dataset.s]=t.value;return}
 if(t.dataset.r){S.pr.ref=t.value;return}
 if(t.dataset.share!=null){S.share=t.checked;return}
 if(t.id=='fq'){S.fq=t.value;$('#fres').innerHTML=fres();return}
 if(t.dataset.iv){S.iv[t.dataset.iv]=t.value;return}
 if(t.dataset.p){S.pf[t.dataset.p]=t.type=='checkbox'?t.checked:t.value;return}
 if(t.dataset.c){const[i,j]=t.dataset.c.split(':').map(Number);S.Q.find(x=>x.id==i).chk[j]=t.checked?1:0;return}
 if(t.dataset.n){S.Q.find(x=>x.id==+t.dataset.n).note=t.value;return}
 const f=t.dataset.f;if(f)S.fd[f]=t.type=='checkbox'?t.checked:t.value});
document.addEventListener('change',e=>{const t=e.target,f=t.files&&t.files[0];if(t.dataset.a!='pfile'||!f)return;let u='';try{u=URL.createObjectURL(f)}catch(x){}S.pf.url=u;S.pf.name=f.name;S.pf.isImg=f.type.startsWith('image');render()});
setTimeout(()=>{if(S.scr=='splash'){S.scr='auth';render()}},2400);
render();
</script></body></html>
